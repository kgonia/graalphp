\* Safety.cfg without GSHUTDOWN (the code before the fix): a thread's persistent shares outlive it (fails)
CONSTANTS
    Ctx = {c1}
    Thr = {t1}
    K = 3
    MaxCb = 2
    FRAME_ARGS = TRUE
    MIGRATE = FALSE
    DUP_SHARE = FALSE
    GSHUTDOWN = FALSE
    None = None
SPECIFICATION Spec
INVARIANTS NoBad NoDoubleFree NoLeakAfterClose NoLeakAfterThreadEnd Isolation NoEarlyFree
