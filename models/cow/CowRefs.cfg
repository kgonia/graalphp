\* Values, references, calls and statics, breadth-first (wiki/tla-cow.md has the numbers).
CONSTANTS
    NA = 3
    NR = 3
    MainVars = {"a", "b"}
    MaxSteps = 6
    MaxCount = 4
    Features = {"int", "arr", "assign", "ref", "elem", "elemvar", "elemref", "unset", "unsetelem", "nested",
                "read", "call", "static"}
