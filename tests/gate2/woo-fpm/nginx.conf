worker_processes 2;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    # no kept-alive FastCGI connections: a php-fpm worker stays bound to its connection, so with more of them
    # than workers a request on a new one waits for an idle connection to close (60 s timeouts under load)
    upstream php { server 127.0.0.1:9000; }
    server {
        listen 8080;
        root /srv/target/gate2/wordpress;
        index index.php;
        client_max_body_size 8m;
        location / { try_files $uri $uri/ /index.php?$args; }
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
